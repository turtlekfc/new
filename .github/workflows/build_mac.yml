name: Cloud Build Mac APP
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build-macos:
    name: 打包 macOS APP
    runs-on: macos-latest
    steps:
      - name: 檢出原始碼
        uses: actions/checkout@v4
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyarmor pywebview
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: 原始碼混淆加密
        run: |
          pyarmor gen -O pyarmor_mac_dist main.py backend
      - name: 編譯 macOS 應用程式
        run: |
          pyinstaller --noconfirm --windowed --paths "pyarmor_mac_dist" --paths "." --additional-hooks-dir "pyi_hooks" --collect-all backend --collect-all pywebview --hidden-import "sqlite3" --hidden-import "_sqlite3" --hidden-import "webview" --hidden-import "backend" --hidden-import "backend.api" --hidden-import "backend.db" --hidden-import "backend.ledger_manager" --add-data "frontend:frontend" --add-data "templates:templates" --name "MyApp_Mac" pyarmor_mac_dist/main.py
          cd dist
          zip -r MyApp-macOS.zip MyApp_Mac.app
      - name: 上傳成品
        uses: actions/upload-artifact@v4
        with:
          name: macOS-APP
          path: dist/MyApp-macOS.zip
